name: Live smoke tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MONITOR_URL: https://ansem-distribution-monitor.ansemverify.workers.dev
      APP_URL: https://ansem-wallet-checker.ansemverify.workers.dev
      TEST_WALLET: GSzKTurJy8rn6s4Z67e5RdG6j4vPPpvcjzBri2ALSXgX

    steps:
      - name: Verify monitor health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$MONITOR_URL/health" -o health.json
          jq -e '.ok == true and .database == "connected" and .rpc == "connected"' health.json >/dev/null

      - name: Verify monitor distribution API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$MONITOR_URL/api/distributions" -o monitor-distributions.json
          jq -e '.ok == true and .status and .totals and .tracked' monitor-distributions.json >/dev/null
          echo 'LIVE_DISTRIBUTION_SNAPSHOT'
          jq '{status, totals, latestDistribution, tracked}' monitor-distributions.json

      - name: Verify known recipient wallet API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$MONITOR_URL/api/wallet?address=$TEST_WALLET" -o monitor-wallet.json
          jq -e '.ok == true and .found == true and (.transferCount >= 1) and (.amountReceived != null)' monitor-wallet.json >/dev/null
          echo 'LIVE_TEST_WALLET_SNAPSHOT'
          jq '{found, amountReceived, transferCount, tokenMint, sourceWallet, transactionSignature, blockTime}' monitor-wallet.json

      - name: Verify frontend application and metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 "$APP_URL/" -o app.html
          grep -q '<div id="root"' app.html
          grep -q '<title>$ANSEM Wallet Checker — Verify Solana Distributions</title>' app.html
          grep -q 'Check whether a Solana wallet received a real $ANSEM distribution' app.html
          grep -q 'https://ansem-wallet-checker.ansemverify.workers.dev/' app.html
          ! grep -qiE 'demonstration data|clearly labelled|receipt prototype' app.html

      - name: Wait for frontend distribution proxy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status=$(curl --silent --show-error --max-time 30 -o app-distributions.json -w '%{http_code}' "$APP_URL/api/distributions" || true)
            if [ "$status" = '200' ] && jq -e '.ok == true and .status and .totals and .tracked' app-distributions.json >/dev/null 2>&1; then
              exit 0
            fi
            echo "Frontend distribution proxy is not ready: HTTP $status, attempt $attempt/30"
            sleep 20
          done
          cat app-distributions.json 2>/dev/null || true
          exit 1

      - name: Wait for frontend known recipient proxy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status=$(curl --silent --show-error --max-time 30 -o wallet.json -w '%{http_code}' "$APP_URL/api/wallet?address=$TEST_WALLET" || true)
            if [ "$status" = '200' ] && jq -e '.ok == true and .found == true and (.transferCount >= 1) and (.amountReceived != null)' wallet.json >/dev/null 2>&1; then
              exit 0
            fi
            echo "Frontend wallet proxy is not ready: HTTP $status, attempt $attempt/30"
            sleep 20
          done
          cat wallet.json 2>/dev/null || true
          exit 1
