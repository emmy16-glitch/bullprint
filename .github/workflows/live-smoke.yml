name: Live smoke tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MONITOR_URL: https://ansem-distribution-monitor.emmanuelokunlola16.workers.dev
      APP_URL: https://ansem-wallet-checker.emmanuelokunlola16.workers.dev
      TEST_WALLET: GV6UUmNxz2RpKxmNAPadYKb7uQpszwqQAu3qLJxVdC52

    steps:
      - name: Verify monitor health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$MONITOR_URL/health" -o health.json
          jq -e '.ok == true and .database == "connected" and .rpc == "connected"' health.json >/dev/null

      - name: Verify monitor distribution API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$MONITOR_URL/api/distributions" -o monitor-distributions.json
          jq -e '.ok == true and .status and .totals and .tracked' monitor-distributions.json >/dev/null

      - name: Verify monitor wallet API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$MONITOR_URL/api/wallet?address=$TEST_WALLET" -o monitor-wallet.json
          jq -e '.ok == true and (.found == true or .found == false)' monitor-wallet.json >/dev/null

      - name: Verify frontend application
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$APP_URL/" -o app.html
          grep -q '<div id="root"' app.html

      - name: Wait for frontend distribution proxy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status=$(curl --silent --show-error --max-time 30 -o app-distributions.json -w '%{http_code}' "$APP_URL/api/distributions" || true)
            if [ "$status" = '200' ] && jq -e '.ok == true and .status and .totals and .tracked' app-distributions.json >/dev/null 2>&1; then
              exit 0
            fi
            echo "Frontend distribution proxy is not ready: HTTP $status, attempt $attempt/30"
            sleep 20
          done
          cat app-distributions.json 2>/dev/null || true
          exit 1

      - name: Wait for frontend wallet proxy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status=$(curl --silent --show-error --max-time 30 -o wallet.json -w '%{http_code}' "$APP_URL/api/wallet?address=$TEST_WALLET" || true)
            if [ "$status" = '200' ] && jq -e '.ok == true and (.found == true or .found == false)' wallet.json >/dev/null 2>&1; then
              exit 0
            fi
            echo "Frontend wallet proxy is not ready: HTTP $status, attempt $attempt/30"
            sleep 20
          done
          cat wallet.json 2>/dev/null || true
          exit 1
