name: Live smoke tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MONITOR_URL: https://ansem-distribution-monitor.emmanuelokunlola16.workers.dev
      APP_URL: https://ansem-wallet-checker.emmanuelokunlola16.workers.dev
      TEST_WALLET: GV6UUmNxz2RpKxmNAPadYKb7uQpszwqQAu3qLJxVdC52

    steps:
      - name: Wait for monitor deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 20 "$MONITOR_URL/health" -o health.json; then
              if jq -e '.ok == true and .database == "connected" and .rpc == "connected"' health.json >/dev/null; then
                cat health.json
                exit 0
              fi
            fi
            echo "Monitor is not ready yet (attempt $attempt/30)."
            sleep 20
          done
          echo "Monitor failed to become healthy."
          cat health.json 2>/dev/null || true
          exit 1

      - name: Verify monitor distribution API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "$MONITOR_URL/api/distributions" -o monitor-distributions.json
          jq -e '.ok == true and .status and .totals and .tracked' monitor-distributions.json >/dev/null
          cat monitor-distributions.json

      - name: Wait for frontend deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 20 "$APP_URL/" -o app.html; then
              if grep -q '<div id="root"' app.html; then
                exit 0
              fi
            fi
            echo "Frontend is not ready yet (attempt $attempt/30)."
            sleep 20
          done
          echo "Frontend failed to become available."
          head -n 30 app.html 2>/dev/null || true
          exit 1

      - name: Verify frontend distribution proxy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "$APP_URL/api/distributions" -o app-distributions.json
          jq -e '.ok == true and .status and .totals and .tracked' app-distributions.json >/dev/null

      - name: Verify frontend wallet lookup proxy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "$APP_URL/api/wallet?address=$TEST_WALLET" -o wallet.json
          jq -e '.ok == true and (.found == true or .found == false)' wallet.json >/dev/null
          cat wallet.json
