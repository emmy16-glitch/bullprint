name: Report latest validation

on:
  workflow_run:
    workflows:
      - CI
      - Live smoke tests
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Publish validation result
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run
            const title = 'Latest Wallet Checker validation'
            const body = [
              '## Wallet Checker validation',
              '',
              `- Workflow: **${run.name}**`,
              `- Commit: \`${run.head_sha}\``,
              `- Conclusion: **${run.conclusion}**`,
              `- Run: ${run.html_url}`,
            ].join('\n')

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })

            const issue = issues.find((item) => item.title === title)

            if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              })
            }
