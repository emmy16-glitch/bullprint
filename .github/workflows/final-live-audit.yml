name: Final live audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONITOR_URL: https://ansem-distribution-monitor.ansemverify.workers.dev
      APP_URL: https://ansem-wallet-checker.ansemverify.workers.dev
      TRACKED_MINT: 9cRCn9rGT8V2imeM2BaKs13yhMEais3ruM3rPvTGpump

    steps:
      - name: Verify freshly reconciled totals
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            status=$(curl --silent --show-error --max-time 30 -o integrity.json -w '%{http_code}' "$MONITOR_URL/api/integrity" || true)
            if [ "$status" = '200' ] && jq -e '.ok == true and .reconciliation.fresh == true and (.reconciliation.transferCount > 0) and (.totals.amountRaw != "0") and (.totals.verifiedTransfers == .reconciliation.transferCount)' integrity.json >/dev/null 2>&1; then
              curl --fail --silent --show-error --max-time 30 "$MONITOR_URL/api/distributions" -o distributions.json
              test "$(jq -r '.totals.amountRaw' integrity.json)" = "$(jq -r '.totals.amountRaw' distributions.json)"
              test "$(jq -r '.totals.verifiedTransfers' integrity.json)" = "$(jq -r '.totals.verifiedTransfers' distributions.json)"
              jq '.' integrity.json
              exit 0
            fi
            echo "Reconciliation is not ready: HTTP $status, attempt $attempt/20"
            sleep 20
          done
          cat integrity.json 2>/dev/null || true
          exit 1

      - name: Verify deployed tracked-mint logo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 "$APP_URL/" -o app.html
          asset_path=$(grep -oE 'src="/assets/[^"]+\.js"' app.html | head -n 1 | cut -d'"' -f2)
          test -n "$asset_path"
          curl --fail --silent --show-error --location --max-time 30 "$APP_URL$asset_path" -o app.js
          grep -q "i2c.seadn.io/solana/$TRACKED_MINT" app.js
