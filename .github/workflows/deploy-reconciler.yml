name: Deploy distribution reconciler

on:
  push:
    branches:
      - main
    paths:
      - 'cloudflare-reconciler/**'
      - '.github/workflows/deploy-reconciler.yml'
  pull_request:
    paths:
      - 'cloudflare-reconciler/**'
      - '.github/workflows/deploy-reconciler.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build reconciler deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          jq '
            .name = "ansem-distribution-reconciler"
            | .main = "cloudflare-reconciler/src/index.js"
            | del(.secrets_store_secrets, .ratelimits)
            | (.d1_databases[] |= del(.migrations_dir))
            | .triggers = {"crons": ["* * * * *"]}
          ' cloudflare-monitor/wrangler.jsonc > wrangler-reconciler.json

      - name: Deploy reconciliation Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler-reconciler.json

      - name: Verify automatic reconciliation
        shell: bash
        run: |
          set -euo pipefail
          reconciler_url='https://ansem-distribution-reconciler.ansemverify.workers.dev'
          monitor_url='https://ansem-distribution-monitor.ansemverify.workers.dev'

          for attempt in $(seq 1 24); do
            status=$(curl --silent --show-error --max-time 30 -o reconciler.json -w '%{http_code}' "$reconciler_url/health" || true)
            if [ "$status" = '200' ] && jq -e '.ok == true and .reconciliation.fresh == true and (.reconciliation.transferCount > 0) and (.totals.amountRaw != "0") and (.totals.verifiedTransfers == .reconciliation.transferCount)' reconciler.json >/dev/null 2>&1; then
              curl --fail --silent --show-error --max-time 30 "$monitor_url/api/distributions" -o distributions.json
              test "$(jq -r '.totals.amountRaw' reconciler.json)" = "$(jq -r '.totals.amountRaw' distributions.json)"
              test "$(jq -r '.totals.verifiedTransfers' reconciler.json)" = "$(jq -r '.totals.verifiedTransfers' distributions.json)"
              jq '.' reconciler.json
              exit 0
            fi
            echo "Waiting for scheduled reconciliation, attempt $attempt/24, HTTP $status"
            sleep 15
          done

          cat reconciler.json 2>/dev/null || true
          exit 1
